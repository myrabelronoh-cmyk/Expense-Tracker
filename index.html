<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker — Live Currency Conversion</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app" class="app">
      <header class="header">
        <div class="header__text">
          <h1>Expense Tracker</h1>
          <p class="subtitle">Log spending in any currency and see totals in your home currency.</p>
        </div>
        <div class="header__controls">
          <label class="field field--inline">
            <span>Home currency</span>
            <select id="home-currency" name="home-currency" aria-label="Home currency"></select>
          </label>
        </div>
      </header>

      <p id="rates-status" class="status" role="status" aria-live="polite"></p>
      <button type="button" id="retry-rates" class="btn btn--secondary btn--small">Retry loading rates</button>

      <main class="layout">
        <section class="panel" aria-labelledby="add-heading">
          <h2 id="add-heading">Add expense</h2>
          <form id="expense-form" class="form">
            <label class="field">
              <span>Description</span>
              <input
                id="description"
                name="description"
                type="text"
                required
                maxlength="120"
                placeholder="e.g. Lunch in Nairobi"
              />
            </label>
            <div class="form__row">
              <label class="field">
                <span>Amount</span>
                <input
                  id="amount"
                  name="amount"
                  type="number"
                  required
                  min="0"
                  step="0.01"
                  placeholder="0.00"
                />
              </label>
              <label class="field">
                <span>Currency</span>
                <select id="currency" name="currency" aria-label="Expense currency"></select>
              </label>
            </div>
            <label class="field">
              <span>Category</span>
              <select id="category" name="category" aria-label="Category"></select>
            </label>
            <button type="submit" class="btn btn--primary">Add expense</button>
          </form>
        </section>

        <section class="panel panel--list" aria-labelledby="list-heading">
          <div class="panel__head">
            <h2 id="list-heading">Your expenses</h2>
            <label class="field field--inline">
              <span>Filter</span>
              <select id="filter-category" name="filter-category" aria-label="Filter by category"></select>
            </label>
          </div>
          <p id="filtered-label" class="filtered-label"></p>
          <p id="empty-state" class="empty-state">No expenses yet. Add your first one above.</p>
          <ul id="expense-list" class="expense-list" aria-live="polite"></ul>
          <footer class="total-bar">
            <span>Running total (filtered)</span>
            <strong id="total-amount">—</strong>
          </footer>
        </section>
      </main>
    </div>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
